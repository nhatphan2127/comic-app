openapi: 3.1.0
info:
  title: Comic Platform API
  version: 1.0.0
  description: |
    REST API of the comic reading platform.

    **Conventions** (details in `backend/docs/api-conventions.md`)
    - Base URL: `/api/v1`. Breaking changes ship as `/api/v2`; v1 keeps working.
    - Success: `{ "data": ... }`. A page of a collection: `{ "data": [...], "meta": { page, pageSize, totalItems, totalPages } }`.
    - Errors: RFC 9457 `application/problem+json` (`type`, `title`, `status`, `detail`, `instance`).
    - Pagination: `?page=1&pageSize=20` (1-based). Sorting: `?sort=-rating,name` (`-` = descending).
      Multi-value filters: comma-separated or repeated (`?contentRating=safe,suggestive`).
    - Create → `201` + `Location` header. Delete / nothing to return → `204`.
    - Authentication: `POST /auth/login` sets an HttpOnly `sid` cookie that the browser sends back
      (`credentials: 'include'` from another origin). The token is never in a response body.
      State-changing requests carrying the cookie must have an `Origin` (or `Referer`) from `CLIENT_ORIGIN`,
      otherwise they are answered `403` (CSRF protection).
servers:
  - url: /api/v1
    description: Version 1 (this server)

tags:
  - name: Auth
  - name: Me
    description: Resources that belong to the logged-in user.
  - name: Users
    description: Public profiles.
  - name: Comics
  - name: Chapters
  - name: Comments
  - name: Reports
    description: Readers flagging a comic or a comment.
  - name: Moderation
    description: Admins and moderators.
  - name: Admin
    description: Admins only.
  - name: Publishing
    description: |
      For contributors' scripts: create comics and chapters with an API key instead of the Studio form.
      Create a key in the Studio (API keys) and send it as `Authorization: Bearer ink_...`.
      Session tokens are not accepted here and API keys are not accepted anywhere else.
      Everything published still goes through moderation. Limits: 60 uploads per key per 10 minutes,
      10 MB per image, 100 pages per chapter, JPEG/PNG/WEBP/GIF only (file contents are checked).
      Admins can also import many comic folders at once as one zip (`POST /publish/bulk`, scope `bulk:write`).

security:
  - sessionCookie: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password, email, displayName]
              properties:
                userName: { type: string, pattern: '^[A-Za-z0-9_.-]{3,32}$' }
                password: { type: string, minLength: 6, maxLength: 72 }
                email: { type: string, format: email }
                displayName: { type: string, minLength: 1, maxLength: 50 }
      responses:
        '201':
          description: Account created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      userName: { type: string }
                      displayName: { type: string }
                      role: { $ref: '#/components/schemas/Role' }
                      createdAt: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in (sets the session cookie)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userName, password]
              properties:
                userName: { type: string, description: Username or email. }
                password: { type: string }
      responses:
        '200':
          description: Logged in. The session token is only in the cookie.
          headers:
            Set-Cookie:
              description: '`sid=<token>; Path=/api; HttpOnly; SameSite=Lax` (+ `Secure` in production)'
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      expiresAt: { type: string, format: date-time }
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          userName: { type: string }
                          role: { $ref: '#/components/schemas/Role' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      description: Deletes the session on the server and clears the cookie. Also 204 without a valid session.
      security: []
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Always 204, whether or not the email is registered. The link is valid for 30 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Set a new password with the token from the reset email
      description: Every session of the account is logged out.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword, confirmPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 6, maxLength: 72 }
                confirmPassword: { type: string }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Me
  /me:
    get:
      tags: [Me]
      summary: My profile
      responses:
        '200': { $ref: '#/components/responses/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Me]
      summary: Update my profile (only the fields sent change)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                username: { type: string }
                email: { type: string }
                bio: { type: string }
                socialLinks: { type: string }
                avatar: { type: string, description: Empty string removes the image. }
                background: { type: string, description: Empty string removes the image. }
      responses:
        '200': { $ref: '#/components/responses/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/avatar:
    put:
      tags: [Me]
      summary: Replace my avatar
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200': { $ref: '#/components/responses/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /me/background:
    put:
      tags: [Me]
      summary: Replace my profile background
      requestBody: { $ref: '#/components/requestBodies/SingleImage' }
      responses:
        '200': { $ref: '#/components/responses/UserProfile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /me/password:
    put:
      tags: [Me]
      summary: Change my password (logs out my other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword, confirmPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6, maxLength: 72 }
                confirmPassword: { type: string }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/preferences:
    patch:
      tags: [Me]
      summary: Update my preferences (only the fields sent change)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Preferences' }
      responses:
        '200':
          description: The stored preferences.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Preferences' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/following:
    get:
      tags: [Me]
      summary: Comics I follow (all of them, grouped by category on the client)
      responses:
        '200':
          description: Followed comics with category and reading progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FollowingEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/following/{comicId}:
    parameters:
      - { $ref: '#/components/parameters/comicId' }
    get:
      tags: [Me]
      summary: Do I follow this comic?
      description: '`200` with the follow record, or `404` when not followed.'
      responses:
        '200': { $ref: '#/components/responses/Follow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Me]
      summary: Follow a comic, or move it to another category
      description: Idempotent. `201` when the comic was not followed yet, `200` otherwise.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId: { type: [string, 'null'] }
      responses:
        '200': { $ref: '#/components/responses/Follow' }
        '201':
          description: Now following.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Follow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      summary: Unfollow a comic (idempotent)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/following-categories:
    get:
      tags: [Me]
      summary: My following categories (shared defaults first)
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FollowingCategory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      summary: Create a category
      requestBody: { $ref: '#/components/requestBodies/CategoryName' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FollowingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/following-categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Me]
      summary: Rename one of my categories
      requestBody: { $ref: '#/components/requestBodies/CategoryName' }
      responses:
        '200':
          description: Renamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FollowingCategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      summary: Delete one of my categories (its comics stay followed, without a category)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/ratings/{comicId}:
    parameters:
      - { $ref: '#/components/parameters/comicId' }
    put:
      tags: [Me]
      summary: Set my rating for a comic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Rating stored; the comic's new average.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comicId: { type: string }
                      userRating: { type: integer }
                      averageRating: { type: number }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      summary: Remove my rating (idempotent)
      responses:
        '200':
          description: Rating removed; the comic's new average.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comicId: { type: string }
                      userRating: { type: integer, enum: [0] }
                      averageRating: { type: number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/history:
    get:
      tags: [Me]
      summary: My reading history, most recent first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: A page of history entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/HistoryEntry' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Me]
      summary: Clear my whole reading history
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/history/{chapterId}:
    parameters:
      - { $ref: '#/components/parameters/chapterId' }
    put:
      tags: [Me]
      summary: Save my reading progress in a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPage]
              properties:
                currentPage: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      chapterId: { type: string }
                      currentPage: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      summary: Remove one chapter from my history
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/recommendations:
    get:
      tags: [Me]
      summary: Comics recommended for me ("For you")
      description: |
        A hybrid of content-based filtering (genres, formats, demographic and type, weighted by IDF, compared
        with the comics I like) and user-based collaborative filtering (what readers with tastes like mine
        like). How much I like a comic comes from what I did with it: following it, the chapters I read and
        my rating. Comics I follow, read or rated are left out, as are those above my content filter
        (`filter` in PATCH /me/preferences).

        Each item says why it is there (`reason`): `similar_readers` (readers like me like it; `count` of
        them), `because_you_liked` (closest to `comic`, one I like) or `trending` (this week's rankings,
        only when I have not liked anything yet). Comics that barely resemble what I like (content
        cosine below 0.2) are left out, so the list may be short or empty; it is not filled up.

        The list is cached for 15 minutes and recomputed as soon as I follow, rate, open a new chapter or
        change my content filter.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: The recommendations, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RecommendedComic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications:
    get:
      tags: [Me]
      summary: My notifications, newest first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: isRead
          in: query
          description: Only read (`true`) or unread (`false`) notifications.
          schema: { type: boolean }
      responses:
        '200':
          description: A page of notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Notification' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Me]
      summary: Mark a notification read or unread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isRead]
              properties:
                isRead: { type: boolean }
      responses:
        '200':
          description: The updated notification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/comments:
    get:
      tags: [Me]
      summary: Comments I wrote (on comics and chapters)
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: sort
          in: query
          description: 'Fields: `createdAt`, `likes`, `replyCount`. Default `-createdAt`.'
          schema: { type: string, example: -likes }
      responses:
        '200':
          description: A page of my comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserComment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/contributions/comics:
    get:
      tags: [Me]
      summary: Comics I uploaded, with their review status
      description: >-
        Each item also has `pendingEdit`: true while an edit of the (live) comic is waiting for review. Once a
        moderator decides on such an edit the status goes back to `accept`, since the comic stays live.
      responses:
        '200': { $ref: '#/components/responses/ContributionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/contributions/chapters:
    get:
      tags: [Me]
      summary: Chapters I uploaded, with their review status
      responses:
        '200': { $ref: '#/components/responses/ContributionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/blocks:
    get:
      tags: [Me]
      summary: Users I blocked, most recently blocked first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: A page of blocked users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BlockedUser' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/blocks/{userId}:
    parameters:
      - { $ref: '#/components/parameters/userId' }
    put:
      tags: [Me]
      summary: Block a user (idempotent)
      description: |
        Blocking hides someone from me only. Their comments, and every reply under them, leave the comment
        lists and comment pages I am shown (`GET /comments/{commentId}` on one of them is a 404 for me), and
        their replies to my comments no longer notify me. Their public profile stays reachable. Nothing
        changes for other users, and the moderation tools ignore blocks.
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Me]
      summary: Unblock a user (idempotent)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/role-request:
    get:
      tags: [Me]
      summary: My latest contributor request and whether I may send one now
      responses:
        '200':
          description: Request state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request:
                        oneOf:
                          - { $ref: '#/components/schemas/RoleRequest' }
                          - { type: 'null' }
                      canRequest: { type: boolean }
                      retryAfterDays: { type: integer, description: Days left before a rejected reader may ask again. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      summary: Ask to become a contributor (readers only, one pending request at a time)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 20, maxLength: 1000 }
                portfolio: { type: string, maxLength: 1000, description: Links or past work. }
      responses:
        '201':
          description: Request sent.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoleRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Me]
      summary: Withdraw my pending contributor request
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/uploadable-comics:
    get:
      tags: [Me]
      summary: Comics I can add chapters to through the publishing API
      description: Approved comics plus the unreviewed ones I contribute to (staff see every comic). Sorted by name.
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: q
          in: query
          description: Text contained in the name or the url slug.
          schema: { type: string }
      responses:
        '200':
          description: One page of comics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        url: { type: string }
                        coverUrl: { type: string, nullable: true }
                        types: { type: string }
                        status: { type: string, enum: [pending, accept, reject] }
                        visibility: { type: string, enum: [public, hidden] }
                        latestChapter: { type: number, nullable: true, description: Highest chapter number taken (pending chapters included). }
                        mine: { type: boolean, description: I contribute to this comic. }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/editable-comics/{comicId}:
    get:
      tags: [Me]
      summary: A comic I may edit in the studio, in any review state
      description: >-
        Staff may open any comic, contributors only the ones they contribute to (404 otherwise). When an edit
        is waiting for review, the response shows the edited version (`pendingEdit` true).
      parameters:
        - { $ref: '#/components/parameters/comicId' }
      responses:
        '200':
          description: The comic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /me/api-keys:
    get:
      tags: [Me]
      summary: My API keys for the publishing API (never includes the secret)
      responses:
        '200':
          description: All my keys, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Me]
      summary: Create an API key (contributors). The full key is returned once, in `token`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password]
              properties:
                name: { type: string, maxLength: 60, example: My upload script }
                password: { type: string, description: Your current password (keys outlive sessions). }
                scopes:
                  type: array
                  items: { type: string, enum: [comics:write, chapters:write, bulk:write] }
                  description: 'Defaults to comics:write and chapters:write. bulk:write (POST /publish/bulk) is for admins only and must be asked for.'
                expiresInDays: { type: integer, enum: [30, 90, 180, 365], default: 90 }
      responses:
        '201':
          description: Key created. Store `token` now; it cannot be shown again.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/ApiKey' }
                      - type: object
                        properties:
                          token: { type: string, example: ink_3f9a1c0b7d2e_q1W2e3R4t5Y6u7I8o9P0a1S2d3F4g5H6j7K8l9Z0x1C }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /me/api-keys/{keyId}:
    delete:
      tags: [Me]
      summary: Revoke an API key (immediately stops working)
      parameters:
        - name: keyId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Users
  /users/{userId}:
    get:
      tags: [Users]
      summary: Someone's public profile (404 for banned users)
      description: Login is optional. `isBlocked` says whether the logged-in viewer blocked this user (false for guests).
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/userId' }
      responses:
        '200':
          description: The public profile.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/PublicProfile' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/comments:
    get:
      tags: [Users]
      summary: Someone's visible comments (not banned, not on hidden content)
      security: []
      parameters:
        - { $ref: '#/components/parameters/userId' }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: sort
          in: query
          description: 'Fields: `createdAt`, `likes`, `replyCount`. Default `-createdAt`.'
          schema: { type: string, example: -likes }
      responses:
        '200':
          description: A page of comments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/UserComment' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Comics
  /comics:
    get:
      tags: [Comics]
      summary: Search, filter, sort and paginate public comics
      description: |
        Replaces the old `/comics/popular`, `/comics/top-rated` and `/comics/search`:
        - popular: `?sort=-view&pageSize=10`
        - top rated: `?sort=-rating,-view&pageSize=8`
        - search: `?q=one&pageSize=6` (exact name matches first unless `sort` is given)
      security: []
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: sort
          in: query
          description: 'Fields: `createdAt`, `updatedAt`, `name`, `view`, `follow`, `rating`. Default `-createdAt`.'
          schema: { type: string, example: '-rating,-view' }
        - name: q
          in: query
          description: >-
            Text contained in the name, the url slug, an alternative name, the author or the artist, ignoring
            case and accents ("kiem than" finds "Kiếm Thần"). `%` and `_` are plain characters.
          schema: { type: string }
        - name: contentRating
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ContentRating' } }
        - name: type
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [manga, manhwa, manhua, other] } }
        - name: demographic
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [josei, seinen, shoujo, shounen] } }
        - name: releaseStatus
          in: query
          style: form
          explode: false
          schema: { type: array, items: { type: string, enum: [releasing, finished, on hiatus, discontinued] } }
        - name: genre
          in: query
          description: Genre names (case-insensitive); a comic matches if it has any of them.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
        - name: format
          in: query
          description: Format names (case-insensitive); a comic matches if it has any of them.
          style: form
          explode: false
          schema: { type: array, items: { type: string } }
      responses:
        '200':
          description: A page of comics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ComicSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      tags: [Comics]
      summary: Upload a new comic (contributor, moderator, admin)
      description: Goes to the moderation queue unless auto-accept is on.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/ComicInput'
                - type: object
                  required: [coverImage]
                  properties:
                    coverImage: { type: string, format: binary }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComicWriteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /comics/rankings:
    get:
      tags: [Comics]
      summary: Most active public comics of a period
      description: |
        `score = views + 5 × new follows + 3 × new ratings` within the period (UTC days):
        `day` = today, `week` = the last 7 days, `month` = the last 30 days. `all` uses the running totals
        (`view + 5 × follow + 3 × ratings`). Comics with a score of 0 are not ranked. Ties: most followed first.

        Views are counted when a chapter is opened (GET /chapters/{chapterId}): every open for guests, at most
        once per 30 minutes per chapter for a logged-in reader. Per-day views exist only since view counting
        was introduced, so `day` / `week` / `month` start empty on older databases.
      security: []
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [day, week, month, all], default: week }
        - name: contentRating
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ContentRating' } }
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
      responses:
        '200':
          description: A page of ranked comics, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RankedComic' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /comics/suggest:
    get:
      tags: [Comics]
      summary: Search-as-you-type suggestions (at most 8 public comics)
      description: |
        Same matching as `GET /comics?q=` (name, url slug, alternative names, author, artist; ignoring case
        and accents: "kiem than" finds "Kiếm Thần"). Order: exact name, then
        names starting with `q`, then the rest by views. A `q` shorter than 2 characters (after trimming)
        answers `[]`. Limited to 60 requests per minute per IP.
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: contentRating
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ContentRating' } }
      responses:
        '200':
          description: The suggestions, best first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 8
                    items: { $ref: '#/components/schemas/ComicSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /comics/{comicId}:
    get:
      tags: [Comics]
      summary: A public comic, by id or url slug
      description: With a token, `userRating` is the viewer's own rating.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/comicIdOrSlug' }
      responses:
        '200':
          description: The comic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComicDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [Comics]
      summary: Edit a comic I contribute to (the edit goes through moderation)
      description: >-
        A comic that is not approved yet is edited in place and goes back to pending. An approved comic stays
        live unchanged: the edit waits for review (see GET /me/editable-comics/{comicId}) and is applied only
        when a moderator accepts it.
      parameters:
        - { $ref: '#/components/parameters/comicId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/ComicInput'
                - type: object
                  properties:
                    coverImage: { type: string, format: binary, description: Optional new cover. }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComicWriteResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /comics/{comicId}/similar:
    get:
      tags: [Comics]
      summary: Public comics similar to this one
      description: |
        Closest in content: cosine similarity of the genre / format / demographic / type vectors, each
        feature weighted by IDF (`ln(N / n)`, rare features count more, one every comic has counts 0).
        Ties go to the most viewed. The comic itself is never included; comics sharing nothing with it
        are left out, so the list may be shorter than `limit`. Not personalised.
      security: []
      parameters:
        - { $ref: '#/components/parameters/comicIdOrSlug' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 30, default: 10 }
        - name: contentRating
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ContentRating' } }
      responses:
        '200':
          description: The similar comics, most similar first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SimilarComic' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comics/{comicId}/chapters:
    get:
      tags: [Chapters]
      summary: Public chapters of a comic
      security: []
      parameters:
        - { $ref: '#/components/parameters/comicIdOrSlug' }
        - { $ref: '#/components/parameters/page' }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: sort
          in: query
          description: 'Fields: `chapterNumber`, `createdAt`, `updatedAt`. Default `chapterNumber`.'
          schema: { type: string, example: -chapterNumber }
      responses:
        '200':
          description: A page of chapters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChapterSummary' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [Chapters]
      summary: Upload a chapter (contributor, moderator, admin)
      parameters:
        - { $ref: '#/components/parameters/comicId' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, chapterNumber, url, images]
              properties:
                title: { type: string }
                chapterNumber: { type: number, minimum: 0 }
                url: { type: string, description: Unique slug. }
                images:
                  type: array
                  maxItems: 50
                  description: Pages, in reading order.
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      chapterId: { type: string }
                      chapterNumber: { type: number }
                      title: { type: string }
                      imagesCount: { type: integer }
                      status: { $ref: '#/components/schemas/ReviewStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /comics/{comicId}/comments:
    parameters:
      - { $ref: '#/components/parameters/comicId' }
    get:
      tags: [Comments]
      summary: Comments on a comic
      description: For a logged-in viewer, comments by users they blocked (and the replies under them) are left out, and `totalItems` counts only the root comments they see.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/commentPageSize' }
        - { $ref: '#/components/parameters/commentSort' }
      responses:
        '200': { $ref: '#/components/responses/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Comment on a comic
      requestBody: { $ref: '#/components/requestBodies/NewComment' }
      responses:
        '201': { $ref: '#/components/responses/CommentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comics/{comicId}/contributors:
    get:
      tags: [Moderation]
      summary: Contributors of a comic (admin, moderator)
      parameters:
        - { $ref: '#/components/parameters/comicId' }
      responses:
        '200': { $ref: '#/components/responses/ContributorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comics/{comicId}/contributors/{userId}:
    patch:
      tags: [Moderation]
      summary: Accept or reject a contributor's comic submission (admin, moderator)
      parameters:
        - { $ref: '#/components/parameters/comicId' }
        - { $ref: '#/components/parameters/userId' }
      requestBody: { $ref: '#/components/requestBodies/ReviewDecision' }
      responses:
        '200': { $ref: '#/components/responses/ContributorUpdated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Chapters
  /chapters/{chapterId}:
    get:
      tags: [Chapters]
      summary: Read a chapter (pages + my saved progress)
      description: >-
        Only approved, public chapters of approved, public comics, whatever the caller's role (staff preview
        other chapters through GET /moderation/chapters/{chapterId}). With a token the chapter is also recorded
        in the reader's history. Each open counts as a view of the comic (see GET /comics/rankings); a
        logged-in reader opening the same chapter again within 30 minutes is not counted again.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
      responses:
        '200':
          description: The chapter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ChapterDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chapters/{chapterId}/comments:
    parameters:
      - { $ref: '#/components/parameters/chapterId' }
    get:
      tags: [Comments]
      summary: Comments on a chapter
      description: For a logged-in viewer, comments by users they blocked (and the replies under them) are left out, and `totalItems` counts only the root comments they see.
      security: [{}, { sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/commentPageSize' }
        - { $ref: '#/components/parameters/commentSort' }
      responses:
        '200': { $ref: '#/components/responses/CommentPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Comments]
      summary: Comment on a chapter
      requestBody: { $ref: '#/components/requestBodies/NewComment' }
      responses:
        '201': { $ref: '#/components/responses/CommentCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chapters/{chapterId}/contributors:
    get:
      tags: [Moderation]
      summary: Contributors of a chapter (admin, moderator)
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
      responses:
        '200': { $ref: '#/components/responses/ContributorList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /chapters/{chapterId}/contributors/{userId}:
    patch:
      tags: [Moderation]
      summary: Accept or reject a contributor's chapter submission (admin, moderator)
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
        - { $ref: '#/components/parameters/userId' }
      requestBody: { $ref: '#/components/requestBodies/ReviewDecision' }
      responses:
        '200': { $ref: '#/components/responses/ContributorUpdated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Comments
  /comments/{commentId}:
    parameters:
      - { $ref: '#/components/parameters/commentId' }
    get:
      tags: [Comments]
      summary: A comment with all of its replies
      description: Replies by users the viewer blocked (with the replies under them) are left out; a comment written by one of them is a 404.
      security: [{}, { sessionCookie: [] }]
      responses:
        '200':
          description: The comment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Comment'
                      - type: object
                        properties:
                          type: { $ref: '#/components/schemas/CommentTargetType' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Comments]
      summary: Edit my comment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1 }
      responses:
        '200':
          description: Edited.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      type: { $ref: '#/components/schemas/CommentTargetType' }
                      content: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Comments]
      summary: Delete my comment (soft delete; replies stay)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /comments/{commentId}/reaction:
    parameters:
      - { $ref: '#/components/parameters/commentId' }
    put:
      tags: [Comments]
      summary: Set my reaction (idempotent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [like, dislike] }
      responses:
        '200':
          description: My reaction and the new counters.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      commentId: { type: string }
                      userReaction: { type: string, enum: [like, dislike] }
                      likes: { type: integer }
                      dislikes: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Comments]
      summary: Remove my reaction (idempotent)
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Reports
  /reports:
    post:
      tags: [Reports]
      summary: Report a comic or a comment to the moderators
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetType, targetId, reason]
              properties:
                targetType: { $ref: '#/components/schemas/ReportTargetType' }
                targetId: { type: string }
                reason: { type: string, maxLength: 100, example: Spam }
                details: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Report filed.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      targetType: { $ref: '#/components/schemas/ReportTargetType' }
                      targetId: { type: string }
                      reason: { type: string }
                      details: { type: [string, 'null'] }
                      status: { $ref: '#/components/schemas/ReportStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Moderation
  /moderation/queue:
    get:
      tags: [Moderation]
      summary: Comics and chapters by review status, in one response
      parameters:
        - name: comicStatus
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/QueueStatus' } }
        - name: chapterStatus
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/QueueStatus' } }
      responses:
        '200':
          description: Both lists, most recently updated first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      comics:
                        type: array
                        items: { $ref: '#/components/schemas/StaffComic' }
                      chapters:
                        type: array
                        items: { $ref: '#/components/schemas/StaffChapter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /moderation/comics:
    get:
      tags: [Moderation]
      summary: Every comic, for review
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/staffSearch' }
        - { $ref: '#/components/parameters/statusFilter' }
        - { $ref: '#/components/parameters/visibilityFilter' }
        - { $ref: '#/components/parameters/staffComicSort' }
      responses:
        '200': { $ref: '#/components/responses/StaffComicPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /moderation/comics/{comicId}:
    parameters:
      - { $ref: '#/components/parameters/comicId' }
    get:
      tags: [Moderation]
      summary: Full details of any comic (hidden or pending too)
      responses:
        '200':
          description: The comic.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ComicDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Accept or reject a comic (and all its contributor rows)
      description: >-
        For a live comic with an edit waiting for review, the decision is about the edit: accepting applies it,
        rejecting discards it, and the comic stays approved either way. 409 when accepting an edit whose url
        another comic has taken since.
      requestBody: { $ref: '#/components/requestBodies/ReviewDecision' }
      responses:
        '200': { $ref: '#/components/responses/ReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /moderation/chapters:
    get:
      tags: [Moderation]
      summary: Every chapter, for review
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/staffSearch' }
        - { $ref: '#/components/parameters/statusFilter' }
        - { $ref: '#/components/parameters/visibilityFilter' }
        - { $ref: '#/components/parameters/staffChapterSort' }
      responses:
        '200': { $ref: '#/components/responses/StaffChapterPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /moderation/chapters/{chapterId}:
    get:
      tags: [Moderation]
      summary: Preview any chapter with its pages (hidden or pending too)
      description: Does not touch the moderator's reading history.
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
      responses:
        '200':
          description: The chapter.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - { $ref: '#/components/schemas/ChapterDetail' }
                      - type: object
                        properties:
                          comicId: { type: string }
                          status: { $ref: '#/components/schemas/ReviewStatus' }
                          visibility: { $ref: '#/components/schemas/Visibility' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Accept or reject a chapter (and all its contributor rows)
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
      requestBody: { $ref: '#/components/requestBodies/ReviewDecision' }
      responses:
        '200': { $ref: '#/components/responses/ReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /moderation/comments/{commentId}:
    delete:
      tags: [Moderation]
      summary: Remove anyone's comment
      parameters:
        - { $ref: '#/components/parameters/commentId' }
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /moderation/reports:
    get:
      tags: [Moderation]
      summary: Reports filed by readers, newest first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/ReportStatus' } }
      responses:
        '200':
          description: A page of reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Report' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /moderation/reports/{reportId}:
    patch:
      tags: [Moderation]
      summary: Resolve, dismiss or reopen a report
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ReportStatus' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      status: { $ref: '#/components/schemas/ReportStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Recent users, comments and pending submissions
      responses:
        '200':
          description: Dashboard data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      totals:
                        type: object
                        properties:
                          users: { type: integer }
                          staff: { type: integer }
                          comics: { type: integer }
                          chapters: { type: integer }
                          pendingReviews: { type: integer }
                          openReports: { type: integer }
                          pendingRoleRequests: { type: integer }
                      autoAccept: { type: boolean }
                      users: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
                      comments: { type: array, items: { type: object } }
                      comics: { type: array, items: { $ref: '#/components/schemas/StaffComic' } }
                      chapters: { type: array, items: { $ref: '#/components/schemas/StaffChapter' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/comics:
    get:
      tags: [Admin]
      summary: Every comic, for visibility management
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/staffSearch' }
        - { $ref: '#/components/parameters/statusFilter' }
        - { $ref: '#/components/parameters/visibilityFilter' }
        - { $ref: '#/components/parameters/staffComicSort' }
      responses:
        '200': { $ref: '#/components/responses/StaffComicPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/comics/{comicId}:
    patch:
      tags: [Admin]
      summary: Show or hide a comic
      parameters:
        - { $ref: '#/components/parameters/comicId' }
      requestBody: { $ref: '#/components/requestBodies/Visibility' }
      responses:
        '200': { $ref: '#/components/responses/VisibilityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/chapters:
    get:
      tags: [Admin]
      summary: Every chapter, for visibility management
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - { $ref: '#/components/parameters/staffSearch' }
        - { $ref: '#/components/parameters/statusFilter' }
        - { $ref: '#/components/parameters/visibilityFilter' }
        - { $ref: '#/components/parameters/staffChapterSort' }
      responses:
        '200': { $ref: '#/components/responses/StaffChapterPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/chapters/{chapterId}:
    patch:
      tags: [Admin]
      summary: Show or hide a chapter
      parameters:
        - { $ref: '#/components/parameters/chapterId' }
      requestBody: { $ref: '#/components/requestBodies/Visibility' }
      responses:
        '200': { $ref: '#/components/responses/VisibilityResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/users:
    get:
      tags: [Admin]
      summary: Every account, newest first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: q
          in: query
          description: Matches username, display name or email.
          schema: { type: string }
        - name: role
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/Role' } }
        - name: isBanned
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: A page of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AdminUser' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/role-requests:
    get:
      tags: [Admin]
      summary: Contributor requests, newest first
      parameters:
        - { $ref: '#/components/parameters/page' }
        - { $ref: '#/components/parameters/pageSize' }
        - name: status
          in: query
          style: form
          explode: false
          schema: { type: array, items: { $ref: '#/components/schemas/RoleRequestStatus' } }
      responses:
        '200':
          description: A page of requests.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoleRequestListItem' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/role-requests/{requestId}:
    patch:
      tags: [Admin]
      summary: Approve (promotes the reader to contributor) or reject a pending request
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                note: { type: string, maxLength: 500, description: Shown to the reader. }
      responses:
        '200':
          description: The handled request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoleRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/users/{userId}:
    patch:
      tags: [Admin]
      summary: Change a user's role and/or ban status (not your own)
      parameters:
        - { $ref: '#/components/parameters/userId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                role: { $ref: '#/components/schemas/Role' }
                isBanned: { type: boolean }
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      username: { type: string }
                      role: { $ref: '#/components/schemas/Role' }
                      isBanned: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/comments/{commentId}:
    patch:
      tags: [Admin]
      summary: Ban or unban a comment
      parameters:
        - { $ref: '#/components/parameters/commentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isBanned]
              properties:
                isBanned: { type: boolean }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      type: { $ref: '#/components/schemas/CommentTargetType' }
                      isBanned: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/settings:
    get:
      tags: [Admin]
      summary: Platform settings
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Admin]
      summary: Change platform settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                autoAccept: { type: boolean, description: New uploads skip the moderation queue. }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Publishing
  /publish/whoami:
    get:
      tags: [Publishing]
      summary: Check an API key (which account, which scopes, when it expires)
      security: [{ apiKey: [] }]
      responses:
        '200':
          description: The key's owner and the key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id: { type: string }
                          username: { type: string }
                          displayName: { type: [string, 'null'] }
                          role: { $ref: '#/components/schemas/Role' }
                      key:
                        type: object
                        properties:
                          id: { type: string }
                          name: { type: string }
                          prefix: { type: string }
                          scopes: { type: array, items: { type: string } }
                          expiresAt: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /publish/comics:
    post:
      tags: [Publishing]
      summary: Create a comic (goes to the review queue)
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type, demographic, contentRating, cover]
              properties:
                name: { type: string, maxLength: 200 }
                url: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$', description: Slug; generated from the name when omitted. }
                type: { type: string, enum: [manga, manhwa, manhua, other] }
                demographic: { type: string, enum: [josei, seinen, shoujo, shounen] }
                contentRating: { type: string, enum: [safe, suggestive, erotica, pornographic] }
                releaseStatus: { type: string, enum: [releasing, finished, on hiatus, discontinued], default: releasing }
                releasingYear: { type: integer, minimum: 1900 }
                description: { type: string, maxLength: 5000 }
                source: { type: string, maxLength: 500 }
                author: { type: string, maxLength: 100 }
                artist: { type: string, maxLength: 100 }
                genres: { type: string, description: 'Comma-separated, from the Studio list, e.g. "Action, Romance".' }
                formats: { type: string, description: 'Comma-separated, e.g. "Long Strip, Full Color".' }
                cover: { type: string, format: binary }
      responses:
        '201':
          description: Created; `status` is `pending` unless auto-approve is on.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      url: { type: string }
                      name: { type: string }
                      status: { $ref: '#/components/schemas/ReviewStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /publish/comics/{comic}/chapters:
    post:
      tags: [Publishing]
      summary: Upload a chapter to a comic (by id or url slug). Pages are numbered in upload order.
      security: [{ apiKey: [] }]
      parameters:
        - name: comic
          in: path
          required: true
          description: The comic's id or url slug. Unreviewed comics only accept chapters from their own contributors.
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [chapterNumber, pages]
              properties:
                chapterNumber: { type: number, minimum: 0, example: 12.5 }
                title: { type: string, maxLength: 200, description: 'Defaults to "Chapter <number>".' }
                url: { type: string, description: 'Slug; defaults to "<comic-url>-chapter-<number>".' }
                pages:
                  type: array
                  maxItems: 100
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Created; `status` is `pending` unless auto-approve is on.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string }
                      comic:
                        type: object
                        properties:
                          id: { type: string }
                          url: { type: string }
                          name: { type: string }
                      chapterNumber: { type: number }
                      title: { type: string }
                      url: { type: string }
                      pages: { type: integer }
                      status: { $ref: '#/components/schemas/ReviewStatus' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /publish/bulk:
    post:
      tags: [Publishing]
      summary: Import a zip of comic folders in one request (admin keys with bulk:write)
      description: |
        The zip holds comic folders laid out like the uploader script expects: a folder with `comic.json`
        (same fields as `POST /publish/comics`), a `cover.*` image when the comic is new, and one sub-folder
        per chapter (`Chapter 12 - Title/`: first number = chapter number, text after " - " = title) whose
        images are the pages in natural order. Comic folders can sit at any depth.

        A comic whose `comic.json` has an `id`, or whose `url` (or the slug of its `name`) already exists,
        receives the chapters instead of being created again; chapters that already exist are skipped.
        Importing the same zip twice is therefore safe. Each comic and chapter is created in its own
        transaction and still goes through moderation; one that fails is reported and the rest go on.

        Limits: 2 GB zip (`BULK_MAX_ARCHIVE_MB`), 20000 entries, 4 GB unpacked, 10 MB per image,
        100 pages per chapter, 10 imports per key per hour (`PUBLISH_BULK_RATE_LIMIT`).
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archive]
              properties:
                archive: { type: string, format: binary, description: The .zip file. }
      responses:
        '200':
          description: What happened to every comic and chapter in the zip.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          comics:
                            type: object
                            properties:
                              created: { type: integer }
                              existing: { type: integer }
                              failed: { type: integer }
                          chapters:
                            type: object
                            properties:
                              created: { type: integer }
                              skipped: { type: integer }
                              failed: { type: integer }
                      comics:
                        type: array
                        items:
                          type: object
                          properties:
                            folder: { type: string, description: Path of the comic folder inside the zip. }
                            action: { type: string, enum: [created, existing, failed] }
                            id: { type: string }
                            url: { type: string }
                            name: { type: string }
                            status: { $ref: '#/components/schemas/ReviewStatus' }
                            reason: { type: string, description: Why it failed. }
                            httpStatus: { type: integer }
                            chapters:
                              type: array
                              items:
                                type: object
                                properties:
                                  folder: { type: string }
                                  chapterNumber: { type: number }
                                  action: { type: string, enum: [created, skipped, failed] }
                                  id: { type: string }
                                  title: { type: string }
                                  pages: { type: integer }
                                  status: { $ref: '#/components/schemas/ReviewStatus' }
                                  httpStatus: { type: integer, description: 'When failed: the status the single-chapter endpoint would have answered.' }
                                  reason: { type: string, description: Why it was skipped or failed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: HttpOnly session cookie set by `POST /auth/login`.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: ink_<prefix>_<secret>
      description: Personal API key from the Studio (API keys). Only valid on /publish.

  headers:
    Location:
      description: URL of the created resource, e.g. `/api/v1/comics/{id}`.
      schema: { type: string }

  parameters:
    page:
      name: page
      in: query
      description: 1-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    commentPageSize:
      name: pageSize
      in: query
      description: Number of root comments per page (replies are always included).
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    commentSort:
      name: sort
      in: query
      description: '`-score` best first (likes - dislikes), `-createdAt` newest first, `createdAt` oldest first.'
      schema: { type: string, enum: ['-score', '-createdAt', createdAt], default: '-score' }
    staffSearch:
      name: q
      in: query
      description: Matches the comic name (for chapters, the chapter title or its comic's name).
      schema: { type: string }
    statusFilter:
      name: status
      in: query
      style: form
      explode: false
      schema: { type: array, items: { $ref: '#/components/schemas/QueueStatus' } }
    visibilityFilter:
      name: visibility
      in: query
      style: form
      explode: false
      schema: { type: array, items: { $ref: '#/components/schemas/Visibility' } }
    staffComicSort:
      name: sort
      in: query
      description: 'Fields: `createdAt`, `updatedAt`, `name`. Default `-updatedAt`.'
      schema: { type: string }
    staffChapterSort:
      name: sort
      in: query
      description: 'Fields: `createdAt`, `updatedAt`, `chapterNumber`. Default `-updatedAt`.'
      schema: { type: string }
    comicId:
      name: comicId
      in: path
      required: true
      schema: { type: string }
    comicIdOrSlug:
      name: comicId
      in: path
      required: true
      description: The comic's id or its url slug.
      schema: { type: string }
    chapterId:
      name: chapterId
      in: path
      required: true
      schema: { type: string }
    commentId:
      name: commentId
      in: path
      required: true
      schema: { type: string }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string }

  requestBodies:
    SingleImage:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            description: 'The field name is the last path segment: `avatar` or `background`. JPEG, PNG, WEBP or GIF, max 10 MB.'
            properties:
              avatar: { type: string, format: binary }
              background: { type: string, format: binary }
    CategoryName:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [category]
            properties:
              category: { type: string, minLength: 1 }
    NewComment:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [content]
            properties:
              content: { type: string, minLength: 1 }
              parentCommentId: { type: string, description: Reply to this comment (same comic/chapter). }
    ReviewDecision:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [accept, reject] }
    Visibility:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [visibility]
            properties:
              visibility: { $ref: '#/components/schemas/Visibility' }

  responses:
    NoContent:
      description: Done; nothing to return.
    BadRequest:
      description: Invalid input (body, path or query string).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example: { type: about:blank, title: Bad Request, status: 400, detail: '"pageSize" must be between 1 and 100', instance: /api/v1/comics?pageSize=500 }
    Unauthorized:
      description: Missing, invalid or expired token (or wrong credentials on login).
      headers:
        WWW-Authenticate: { schema: { type: string, example: Bearer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated, but not allowed to do this.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: The resource does not exist (or is not visible to you).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with existing data (duplicate username, url slug, category name).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: An uploaded file or the request body is too large.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: The uploaded file is not a JPEG, PNG, WEBP or GIF image.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Rate limit reached; the RateLimit headers say when to retry.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UserProfile:
      description: The user's profile.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/UserProfile' }
    Follow:
      description: The follow record.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Follow' }
    CommentPage:
      description: A page of root comments; `childComment` holds the replies (or null).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items: { $ref: '#/components/schemas/Comment' }
              meta: { $ref: '#/components/schemas/PageMeta' }
    CommentCreated:
      description: Created.
      headers:
        Location: { $ref: '#/components/headers/Location' }
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id: { type: string }
                  type: { $ref: '#/components/schemas/CommentTargetType' }
                  content: { type: string }
                  parentCommentId: { type: [string, 'null'] }
                  userReaction: { type: string, enum: [none] }
    ContributionList:
      description: My submissions.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { type: object } }
    ContributorList:
      description: The target and its contributors.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  contributors:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string }
                        role: { type: string }
                        status: { $ref: '#/components/schemas/QueueStatus' }
                        user:
                          type: object
                          properties:
                            id: { type: string }
                            displayName: { type: [string, 'null'] }
                            avatar: { type: [string, 'null'] }
    ContributorUpdated:
      description: Contributor (and target) status updated.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  userId: { type: string }
                  status: { $ref: '#/components/schemas/ReviewStatus' }
                  updatedAt: { type: string, format: date-time }
    ReviewResult:
      description: Review stored.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id: { type: string }
                  status: { $ref: '#/components/schemas/ReviewStatus' }
    VisibilityResult:
      description: Visibility changed.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id: { type: string }
                  visibility: { $ref: '#/components/schemas/Visibility' }
    StaffComicPage:
      description: A page of comics.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/StaffComic' } }
              meta: { $ref: '#/components/schemas/PageMeta' }
    StaffChapterPage:
      description: A page of chapters.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/StaffChapter' } }
              meta: { $ref: '#/components/schemas/PageMeta' }
    Settings:
      description: Current settings.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  autoAccept: { type: boolean }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Not Found }
        status: { type: integer, example: 404 }
        detail: { type: string, example: Comic not found }
        instance: { type: string, example: /api/v1/comics/unknown }
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 20 }
        totalItems: { type: integer, example: 92 }
        totalPages: { type: integer, example: 5 }
    Role:
      type: string
      enum: [user, contributor, moderator, admin]
    ContentRating:
      type: string
      enum: [safe, suggestive, erotica, pornographic]
    ReviewStatus:
      type: string
      enum: [pending, accept, reject]
    QueueStatus:
      type: string
      enum: [pending, accept, reject]
    Visibility:
      type: string
      enum: [public, hidden]
    CommentTargetType:
      type: string
      enum: [comic, chapter]
    PublicProfile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        background: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        socialLinks: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string }
        stats:
          type: object
          properties:
            following: { type: integer }
            comments: { type: integer }
            likes: { type: integer }
        isBlocked: { type: boolean }
    BlockedUser:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        blockedAt: { type: string }
    ReportTargetType:
      type: string
      enum: [comic, comment]
    ReportStatus:
      type: string
      enum: [open, resolved, dismissed]
    Report:
      type: object
      properties:
        id: { type: string }
        reason: { type: string }
        details: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ReportStatus' }
        createdAt: { type: string }
        updatedAt: { type: string }
        reporter:
          type: object
          properties:
            username: { type: [string, 'null'] }
            displayName: { type: [string, 'null'] }
        target:
          type: object
          properties:
            type: { $ref: '#/components/schemas/ReportTargetType' }
            id: { type: string }
            title: { type: [string, 'null'], description: The comic's name (for a comment, the comic it belongs to). }
            content: { type: [string, 'null'], description: The comment text (comments only). }
            path: { type: [string, 'null'], description: Frontend path to the reported item. }
    ApiKey:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        prefix: { type: string }
        hint: { type: string, example: ink_3f9a1c0b7d2e_… }
        scopes: { type: array, items: { type: string, enum: [comics:write, chapters:write, bulk:write] } }
        status: { type: string, enum: [active, expired, revoked] }
        expiresAt: { type: string }
        lastUsedAt: { type: [string, 'null'] }
        lastUsedIp: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'] }
        createdAt: { type: string }
    RoleRequestStatus:
      type: string
      enum: [pending, approved, rejected, cancelled]
    RoleRequest:
      type: object
      properties:
        id: { type: string }
        requestedRole: { type: string, enum: [contributor] }
        reason: { type: string }
        portfolio: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RoleRequestStatus' }
        reviewNote: { type: [string, 'null'] }
        createdAt: { type: string }
        updatedAt: { type: string }
    RoleRequestListItem:
      allOf:
        - { $ref: '#/components/schemas/RoleRequest' }
        - type: object
          properties:
            user:
              type: object
              properties:
                id: { type: string }
                username: { type: string }
                displayName: { type: [string, 'null'] }
                avatar: { type: [string, 'null'] }
                role: { $ref: '#/components/schemas/Role' }
                createdAt: { type: string }
            reviewer:
              type: [object, 'null']
              properties:
                username: { type: string }
                displayName: { type: [string, 'null'] }
    Preferences:
      type: object
      properties:
        theme: { type: string, enum: [main, dark, light] }
        filter: { type: integer, minimum: 0, maximum: 3, description: '0 safe, 1 suggestive, 2 erotica, 3 pornographic (the highest rating shown).' }
        reader: { type: [object, 'null'], description: Reader settings saved by the frontend; null when never saved. }
    UserProfile:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'] }
        avatar: { type: [string, 'null'] }
        background: { type: [string, 'null'] }
        bio: { type: [string, 'null'] }
        socialLinks: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/Role' }
        isBanned: { type: integer, enum: [0, 1] }
        preference: { $ref: '#/components/schemas/Preferences' }
        stats:
          type: object
          properties:
            following: { type: integer }
            collections: { type: integer, description: Following categories the user created. }
            comments: { type: integer }
            likes: { type: integer, description: Likes received on the user's comments. }
    Follow:
      type: object
      properties:
        comicId: { type: string }
        categoryId: { type: [string, 'null'] }
        createdAt: { type: string }
    FollowingCategory:
      type: object
      properties:
        id: { type: string }
        category: { type: string }
        userId: { type: [string, 'null'], description: null for shared default categories. }
    FollowingEntry:
      type: object
      properties:
        userId: { type: string }
        updatedAt: { type: string }
        comic: { type: object }
        category:
          type: object
          properties:
            id: { type: string }
            category: { type: string }
        readedChapter: { type: number, description: Number of the most recently read chapter (0 = none). }
        totalChapters: { type: integer, description: Readable (approved, public) chapters. }
        unreadChapters: { type: integer, description: Readable chapters numbered after the furthest one read. }
        latestChapterAt: { type: [string, 'null'] }
        lastReadAt: { type: [string, 'null'] }
        followedAt: { type: [string, 'null'] }
    HistoryEntry:
      type: object
      properties:
        chapterId: { type: string }
        currentPage: { type: integer }
        scrollPosition: { type: [integer, 'null'] }
        readAt: { type: string }
        comicName: { type: string }
        comicUrl: { type: string }
        coverUrl: { type: [string, 'null'] }
        chapterTitle: { type: string }
        chapterUrl: { type: string }
        chapterNumber: { type: number }
        totalPage: { type: integer }
    Notification:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        content: { type: string }
        type: { type: string }
        redirectPath: { type: [string, 'null'] }
        isRead: { type: integer, enum: [0, 1] }
        createdAt: { type: string }
    UserComment:
      type: object
      properties:
        id: { type: string }
        content: { type: string }
        createdAt: { type: string }
        likes: { type: integer }
        dislikes: { type: integer }
        replyCount: { type: integer }
        type: { $ref: '#/components/schemas/CommentTargetType' }
        chapterId: { type: [string, 'null'] }
        targetName: { type: string }
        targetUrl: { type: string }
        targetCoverUrl: { type: [string, 'null'] }
    LatestChapter:
      type: object
      properties:
        id: { type: string }
        chapterNumber: { type: number }
        title: { type: string }
        updatedAt: { type: string }
    ComicSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        coverUrl: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        types: { type: string }
        demographic: { type: string }
        contentRating: { $ref: '#/components/schemas/ContentRating' }
        releaseStatus: { type: string }
        rating: { type: number }
        view: { type: integer }
        follow: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
        genres: { type: array, items: { type: string } }
        latestChapters:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/LatestChapter' }
    ComicSuggestion:
      type: object
      properties:
        id: { type: string }
        url: { type: string }
        name: { type: string }
        coverUrl: { type: [string, 'null'] }
        types: { type: string }
        rating: { type: number }
        latestChapter: { type: [number, 'null'], description: Highest readable chapter number. }
    RankedComic:
      allOf:
        - $ref: '#/components/schemas/ComicSummary'
        - type: object
          properties:
            rank: { type: integer, minimum: 1 }
            score: { type: integer, description: Activity score within the requested period. }
    SimilarComic:
      allOf:
        - $ref: '#/components/schemas/ComicSummary'
        - type: object
          properties:
            similarity: { type: number, minimum: 0, maximum: 1 }
    RecommendedComic:
      allOf:
        - $ref: '#/components/schemas/ComicSummary'
        - type: object
          properties:
            score: { type: number, minimum: 0, maximum: 1, description: 'Blended score; 0 for `trending` items.' }
            reason: { $ref: '#/components/schemas/RecommendationReason' }
    RecommendationReason:
      oneOf:
        - type: object
          required: [type, count]
          properties:
            type: { const: similar_readers }
            count: { type: integer, minimum: 2, description: Readers with similar tastes who like it. }
        - type: object
          required: [type, comic]
          properties:
            type: { const: because_you_liked }
            comic:
              type: object
              description: The comic I like that is closest to this one.
              properties:
                id: { type: string }
                url: { type: string }
                name: { type: string }
        - type: object
          required: [type]
          properties:
            type: { const: trending }
    ComicDetail:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }
        description: { type: [string, 'null'] }
        coverUrl: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
        types: { type: string }
        contentRating: { $ref: '#/components/schemas/ContentRating' }
        demographic: { type: string }
        rating: { type: number }
        view: { type: integer }
        follow: { type: integer }
        releaseStatus: { type: string }
        status: { $ref: '#/components/schemas/ReviewStatus' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        releasingYear: { type: [integer, 'null'] }
        author: { type: [string, 'null'] }
        artist: { type: [string, 'null'] }
        genres: { type: array, items: { type: string } }
        formats: { type: array, items: { type: string } }
        pendingEdit:
          type: boolean
          description: >-
            Only on the moderation and studio endpoints. True when the comic is live and an edit is waiting for
            review; the other fields then show the edited version, while readers still see the approved one.
        names:
          type: array
          description: Only on the public and studio endpoints.
          items:
            type: object
            properties:
              name: { type: string }
              country: { type: string }
        userRating: { type: integer, description: Only on the public endpoint; 0 when not rated or anonymous. }
        progress:
          type: [object, 'null']
          description: Only on the public endpoint for a logged-in viewer; null when they never opened a chapter.
          properties:
            lastChapterId: { type: string }
            lastPage: { type: integer }
            readChapterIds: { type: array, items: { type: string } }
    ComicInput:
      type: object
      required: [name, types, demographic, url]
      properties:
        name: { type: string }
