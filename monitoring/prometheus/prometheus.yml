global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Monitor Node.js backend
  - job_name: nodejs-backend
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:5000'