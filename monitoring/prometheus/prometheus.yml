global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Backend metrics are exposed by Nginx on the app server (nginx/default.conf, port 9464).
  # Replace APP_SERVER_IP with the app server's IP/hostname and add this monitoring server's IP
  # to the `allow` list in that Nginx block.
  - job_name: comic-app-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["APP_SERVER_IP:9464"]
        labels:
          service_name: comic-app-backend
