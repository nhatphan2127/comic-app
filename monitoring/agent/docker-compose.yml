# Log agent for the APP server (not the monitoring server).
# Reads backend + Nginx logs from the host and pushes them to Loki on the monitoring server.
#
#   cp .env.example .env     # set LOKI_URL to the monitoring server
#   sudo mkdir -p /var/lib/comic-alloy
#   docker compose up -d

name: comic-monitoring-agent

services:
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    env_file:
      - ./.env
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${BACKEND_LOG_DIR:-/var/log/comic-app}:/var/log/comic-app:ro
      - ${NGINX_LOG_DIR:-/var/log/nginx}:/var/log/nginx:ro
      - ${ALLOY_DATA_DIR:-/var/lib/comic-alloy}:/var/lib/alloy/data
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
