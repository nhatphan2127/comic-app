log_format access_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","message":"HTTP request","service":{"name":"comic-app-nginx"},"log_type":"access","request":{"id":"$request_id"},"http":{"request":{"method":"$request_method"},"response":{"status_code":$status,"bytes_sent":$body_bytes_sent},"duration_seconds":$request_time},"url":{"path":"$uri"},"source":{"ip":"$remote_addr"},"upstream":{"status":"$upstream_status","response_time":"$upstream_response_time"}}';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    client_max_body_size 2100m;
    client_body_timeout 1800s;
    send_timeout 1800s;

    access_log /dev/stdout access_json;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    location /storage/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
