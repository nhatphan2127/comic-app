# Comic app - Nginx site config for a host-installed Nginx (no Docker).
#
# Install:  sudo cp default.conf /etc/nginx/conf.d/default.conf
#           (Debian/Ubuntu: also remove /etc/nginx/sites-enabled/default)
#           sudo nginx -t && sudo systemctl reload nginx
#
# Layout on the app server:
#   /var/www/comic-app          frontend build output (contents of frontend/dist)
#   127.0.0.1:5000              backend (Node, systemd service comic-app-backend)
#   127.0.0.1:8333              SeaweedFS S3 API (Docker container, bucket comic-images)
#   /var/log/nginx/comic-app.access.log   JSON access log (shipped to Loki by monitoring/agent)

log_format comic_access_json escape=json
    '{"timestamp":"$time_iso8601","level":"info","message":"HTTP request","service":{"name":"comic-app-nginx"},"log_type":"access","request":{"id":"$request_id"},"http":{"request":{"method":"$request_method"},"response":{"status_code":$status,"bytes_sent":$body_bytes_sent},"duration_seconds":$request_time},"url":{"path":"$uri"},"source":{"ip":"$remote_addr"},"upstream":{"status":"$upstream_status","response_time":"$upstream_response_time"}}';

upstream comic_backend {
    server 127.0.0.1:5000;
    keepalive 16;
}

upstream comic_storage {
    server 127.0.0.1:8333;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Replace with your domain, e.g. comic.example.com
    server_name _;

    root /var/www/comic-app;
    index index.html;
    server_tokens off;

    client_max_body_size 2100m;
    client_body_timeout 1800s;
    send_timeout 1800s;

    access_log /var/log/nginx/comic-app.access.log comic_access_json;
    error_log /var/log/nginx/comic-app.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Metrics are only served on the dedicated metrics listener below.
    location = /metrics {
        return 404;
    }

    location /api/ {
        proxy_pass http://comic_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }

    # Public, read-only access to the SeaweedFS bucket.
    location /storage/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://comic_storage/comic-images/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Backend metrics for the Prometheus server on the monitoring host.
# Add the monitoring server IP to the allow list and open TCP 9464 only for that IP in the firewall.
server {
    listen 9464;
    server_name _;
    server_tokens off;
    access_log off;

    location = /metrics {
        allow 127.0.0.1;
        # allow <MONITORING_SERVER_IP>;
        deny all;
        proxy_pass http://comic_backend/metrics;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
