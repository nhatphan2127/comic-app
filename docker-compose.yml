services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_PATH: ${DB_PATH:-/app/data/comic-platform.sqlite}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/storage}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8083,http://127.0.0.1:8083,http://localhost:5173,http://127.0.0.1:5173}
      APP_URL: ${APP_URL:-http://localhost:8083}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-1800000}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-20}
      COMIC_CREATE_RATE_LIMIT: ${COMIC_CREATE_RATE_LIMIT:-10}
      SUGGEST_RATE_LIMIT: ${SUGGEST_RATE_LIMIT:-60}
      PUBLISH_BAD_KEY_LIMIT: ${PUBLISH_BAD_KEY_LIMIT:-20}
      PUBLISH_RATE_LIMIT: ${PUBLISH_RATE_LIMIT:-60}
      PUBLISH_BULK_RATE_LIMIT: ${PUBLISH_BULK_RATE_LIMIT:-10}
      BULK_MAX_ARCHIVE_MB: ${BULK_MAX_ARCHIVE_MB:-2048}
      BULK_MAX_ENTRIES: ${BULK_MAX_ENTRIES:-20000}
      BULK_MAX_UNCOMPRESSED_MB: ${BULK_MAX_UNCOMPRESSED_MB:-4096}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Comic platform <no-reply@localhost>}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./backend/data:/app/data
      - ./backend/storage:/app/storage
      - backend_logs:/app/logs
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - application
      - monitoring

  nginx:
    build:
      context: ./frontend
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-/}
    restart: unless-stopped
    ports:
      - "${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_PORT:-8083}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - application

  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.7.9
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - backend_logs:/var/log/comic-app:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
      - backend
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the environment or .env file}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3017}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
      - application

volumes:
  backend_logs:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
    name: comic-app_grafana_data_nginx

networks:
  application:
  monitoring:
    internal: true
